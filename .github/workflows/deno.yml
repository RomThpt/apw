name: Deno

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Verify formatting
        run: deno fmt --check

      - name: Verify linting
        run: deno lint

      - name: Verify types
        run: deno check src/cli.ts src/approval_mcp.ts

      - name: Run Deno tests
        run: deno test --frozen --allow-env=HOME --allow-read=/tmp --allow-write=/tmp src/

      - name: Build
        run: |
          mkdir -p dist
          deno task compile:x86_64
          deno task compile:aarch64

      - name: Generate release checksums
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: dist
        run: sha256sum apw-aarch64-apple-darwin apw-x86_64-apple-darwin > SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: true
          files: dist/*

  approval-swift:
    # Runs the core unit tests, which use a fake approver. The harness executable is never launched, so no Touch ID
    # prompt or browser is involved.
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test approval core
        run: swift test --package-path prototypes/signin-approval
